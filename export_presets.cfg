#page-footer{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:3px 10px;background:rgba(24,30,36,.75);color:#c9d4dd;font:11px/1.5 system-ui,sans-serif;text-align:center;pointer-events:none}
