</style>
<script>
(function(){function add(){var a=document.createElement('a');a.id='badge-repo';a.href='https://github.com/sw-fun/glm-godot';a.target='_blank';a.rel='noopener';a.title='View source on GitHub';a.innerHTML='<span>GitHub</span>';document.body.appendChild(a);var f=document.createElement('div');f.id='page-footer';f.innerHTML='Defend the Bridge &middot; built with Godot 4.7 &middot; <a href=\"https://github.com/sw-fun/glm-godot\">source</a> &middot; &copy; 2026 Michael A Wright &middot; MIT';document.body.appendChild(f)}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',add)}else{add()}})();
</script>"
